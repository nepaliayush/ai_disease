<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="Arial, sans-serif">
  <!-- Background -->
  <rect width="900" height="700" fill="#f8fafc"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Methodology Framework</text>

  <!-- Input Section -->
  <rect x="50" y="70" width="180" height="80" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="140" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">Clinical Data</text>
  <text x="140" y="125" text-anchor="middle" font-size="11" fill="#334155">Lab Values &amp; Vitals</text>

  <rect x="270" y="70" width="180" height="80" rx="10" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
  <text x="360" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#9d174d">Symptom Data</text>
  <text x="360" y="125" text-anchor="middle" font-size="11" fill="#334155">Patient-Reported</text>

  <!-- Arrows from inputs -->
  <line x1="140" y1="150" x2="140" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="360" y1="150" x2="360" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Clinical Models Box -->
  <rect x="50" y="200" width="180" height="120" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="140" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">Clinical Models</text>
  <text x="140" y="255" text-anchor="middle" font-size="11" fill="#334155">Diabetes</text>
  <text x="140" y="275" text-anchor="middle" font-size="11" fill="#334155">Heart Disease</text>
  <text x="140" y="295" text-anchor="middle" font-size="11" fill="#334155">Liver Disease / CKD</text>

  <!-- Symptom Model Box -->
  <rect x="270" y="200" width="180" height="120" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="360" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">Symptom Triage</text>
  <text x="360" y="255" text-anchor="middle" font-size="11" fill="#334155">Multi-class</text>
  <text x="360" y="275" text-anchor="middle" font-size="11" fill="#334155">Classification</text>
  <text x="360" y="295" text-anchor="middle" font-size="11" fill="#334155">Model</text>

  <!-- Arrows to Fusion -->
  <line x1="140" y1="320" x2="140" y2="370" stroke="#64748b" stroke-width="2"/>
  <line x1="140" y1="370" x2="450" y2="370" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="360" y1="320" x2="360" y2="370" stroke="#64748b" stroke-width="2"/>
  <line x1="360" y1="370" x2="450" y2="370" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Fusion Box -->
  <rect x="250" y="370" width="200" height="80" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="350" y="400" text-anchor="middle" font-size="13" font-weight="bold" fill="#3730a3">Model Fusion</text>
  <text x="350" y="425" text-anchor="middle" font-size="11" fill="#334155">Risk = 0.7 x Clinical + 0.3 x Symptoms</text>

  <!-- Arrow to Post-processing -->
  <line x1="350" y1="450" x2="350" y2="490" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Post-processing Box -->
  <rect x="200" y="490" width="300" height="70" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="2"/>
  <text x="350" y="520" text-anchor="middle" font-size="13" font-weight="bold" fill="#6b21a8">Post-Processing</text>
  <text x="350" y="545" text-anchor="middle" font-size="11" fill="#334155">Lifestyle Adjustment + Prevalence Recalibration</text>

  <!-- Arrow to Output -->
  <line x1="350" y1="560" x2="350" y2="600" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Output Section -->
  <rect x="100" y="600" width="160" height="70" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="180" y="630" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">Risk Scores</text>
  <text x="180" y="655" text-anchor="middle" font-size="11" fill="#334155">Per Disease</text>

  <rect x="290" y="600" width="160" height="70" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="370" y="630" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">SHAP</text>
  <text x="370" y="655" text-anchor="middle" font-size="11" fill="#334155">Explanations</text>

  <rect x="480" y="600" width="160" height="70" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="560" y="630" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">Health Advice</text>
  <text x="560" y="655" text-anchor="middle" font-size="11" fill="#334155">Personalized</text>

  <!-- Model Families Side Note -->
  <rect x="600" y="200" width="250" height="140" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="725" y="225" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">Model Families Evaluated</text>
  <text x="620" y="250" font-size="11" fill="#334155">- Logistic Regression</text>
  <text x="620" y="270" font-size="11" fill="#334155">- Random Forest</text>
  <text x="620" y="290" font-size="11" fill="#334155">- Gradient Boosting</text>
  <text x="620" y="310" font-size="11" fill="#334155">- Support Vector Machine</text>
  <text x="620" y="330" font-size="11" fill="#334155">- Neural Network</text>

  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>
</svg>
